server {
    listen 80;
    server_name 24.199.87.126.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 24.199.87.126.sslip.io;

    # SSL configuration (e.g., Certbot)
    # ssl_certificate /etc/letsencrypt/live/24.199.87.126.sslip.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/24.199.87.126.sslip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
