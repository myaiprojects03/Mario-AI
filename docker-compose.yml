services:
  db:
    image: postgres:15-alpine
    container_name: mario_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mario_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  publisher:
    image: marioaicode-app:latest
    build: .
    container_name: mario_ai_live_publisher
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/mario_ai
      - MODEL_DIR=production_models
      - RUN_EMBEDDED_DASHBOARD=false
    volumes:
      - ./core/dashboard:/app/core/dashboard
    command: ["python", "-m", "core.live_publisher"]

  dashboard:
    image: marioaicode-app:latest
    build: .
    container_name: mario_ai_dashboard
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/mario_ai
    volumes:
      - ./core/dashboard:/app/core/dashboard
    command: ["uvicorn", "core.dashboard.dashboard_app:app", "--host", "0.0.0.0", "--port", "8000"]

  caddy:
    image: caddy:alpine
    container_name: mario_ai_caddy
    restart: always
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-24.199.87.126.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
