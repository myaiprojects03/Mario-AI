services:
  db:
    image: postgres:15-alpine
    container_name: mario_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mario_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: marioaicode-app:latest
    build: .
    container_name: mario_ai_live_publisher
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/mario_ai
      - MODEL_DIR=production_models
    volumes:
      - ./core/dashboard:/app/core/dashboard

volumes:
  postgres_data:
